<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - SkillSwap</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            SkillSwap
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="skills.html">
                Find Skills
            </a>

            <a href="offer.html">
                Offer a Skill
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <section class="form-section">

        <div class="form-card">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your SkillSwap account
            </p>


            <form id="loginForm">


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>


            </form>


            <p class="form-link">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>



    <footer>

        <p>
            © 2026 SkillSwap | Learn • Share • Grow
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
