<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - SkillSwap</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            SkillSwap
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="skills.html">
                Find Skills
            </a>

            <a href="offer.html">
                Offer a Skill
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <section class="profile-section">

        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>


            <h1 id="profileName">
                Student
            </h1>


            <p id="profileEmail">
                -
            </p>


            <div class="profile-details">


                <div>

                    <h3>
                        Skill I Teach
                    </h3>

                    <p id="teachSkillDisplay">
                        -
                    </p>

                </div>



                <div>

                    <h3>
                        Skill I Want To Learn
                    </h3>

                    <p id="learnSkillDisplay">
                        -
                    </p>

                </div>


            </div>


            <button
                onclick="goToDashboard()"
                class="primary-btn"
            >
                Back to Dashboard
            </button>

        </div>

    </section>



    <footer>

        <p>
            © 2026 SkillSwap | Learn • Share • Grow
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
