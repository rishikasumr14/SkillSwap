<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - SkillSwap</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            SkillSwap
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="skills.html">
                Find Skills
            </a>

            <a href="offer.html">
                Offer a Skill
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <!-- SIGNUP -->

    <section class="form-section">

        <div class="form-card">

            <h1>
                Create Account
            </h1>

            <p>
                Join SkillSwap and start learning!
            </p>


            <form id="signupForm">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <label for="teachSkill">
                    Skill You Can Teach
                </label>

                <input
                    type="text"
                    id="teachSkill"
                    placeholder="Example: Python"
                    required
                >


                <label for="learnSkill">
                    Skill You Want To Learn
                </label>

                <input
                    type="text"
                    id="learnSkill"
                    placeholder="Example: Web Development"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>


            </form>


            <p class="form-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>



    <footer>

        <p>
            © 2026 SkillSwap | Learn • Share • Grow
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
